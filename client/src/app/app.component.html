<header class="nav-shell" *ngIf="authService.isLoggedIn()">
  <a routerLink="/" class="nav-brand">
    <h1>TaskFlow</h1>
  </a>
  <nav>
    <a routerLink="/board" routerLinkActive="active">Board</a>
    <div class="user-profile-container">
      <div class="profile-trigger" (click)="toggleProfileMenu($event)" title="Profile Menu" [class.active]="showProfileMenu">
        <div class="user-avatar">
          <span>JD</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dropdown-chevron" [class.open]="showProfileMenu"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      
      @if (showProfileMenu) {
        <div class="profile-dropdown" (click)="$event.stopPropagation()">
          <div class="dropdown-header">
            <strong>John Doe</strong>
            <span>john&#64;example.com</span>
          </div>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" routerLink="/profile" (click)="showProfileMenu = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            Edit Profile
          </a>
          <button class="dropdown-item text-danger" (click)="authService.logout(); showProfileMenu = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
            Logout
          </button>
        </div>
      }
    </div>
  </nav>
</header>

<div class="layout-wrapper" [class.no-sidebar]="!authService.isLoggedIn()">
  <app-sidebar *ngIf="authService.isLoggedIn()"></app-sidebar>
  <main class="app-container" [class.full-width]="!authService.isLoggedIn()">
    <router-outlet></router-outlet>
  </main>
</div>
