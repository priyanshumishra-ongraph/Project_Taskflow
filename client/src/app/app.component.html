<mat-toolbar class="nav-shell mat-elevation-z4" *ngIf="authService.isLoggedIn()" style="position: relative; z-index: 10;">
  <button mat-icon-button (click)="toggleSidebar()" style="margin-right: 8px; color: white;"><mat-icon>menu</mat-icon></button>

  <a routerLink="/" class="nav-brand" style="color: inherit; text-decoration: none; display: flex; align-items: center; margin-right: 24px;">
    <mat-icon style="margin-right: 8px;">task_alt</mat-icon>
    <span style="font-size: 1.5rem; font-weight: 500;">TaskFlow</span>
  </a>
  
  

  <span class="spacer" style="flex: 1 1 auto;"></span>

  <button mat-icon-button routerLink="/help" aria-label="Help & Documentation" title="Help" style="margin-right: 8px; color: #fff;">
    <mat-icon>help_outline</mat-icon>
  </button>

  <div class="user-profile-container">
    <button mat-icon-button [matMenuTriggerFor]="profileMenu" aria-label="Profile Menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #profileMenu="matMenu" xPosition="before">
      <div class="dropdown-header" style="padding: 16px; outline: none;">
        <div style="font-weight: 500;">{{ authService.currentUser()?.name || 'User' }} <span style="font-size: 0.8em; color: #64748b; font-weight: normal;">({{ authService.currentUser()?.role || 'Member' }})</span></div>
        <div style="font-size: 0.85em; opacity: 0.7;">{{ authService.currentUser()?.email }}</div>
      </div>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="authService.logout()">
        <mat-icon color="warn">logout</mat-icon>
        <span style="color: #f44336;">Logout</span>
      </button>
    </mat-menu>
  </div>
</mat-toolbar>

<div class="layout-wrapper" [class.no-sidebar]="!authService.isLoggedIn()">
  <app-sidebar *ngIf="authService.isLoggedIn()" #sidebar></app-sidebar>
  <main class="app-container" [class.full-width]="!authService.isLoggedIn()">
    <router-outlet></router-outlet>
  </main>
</div>
