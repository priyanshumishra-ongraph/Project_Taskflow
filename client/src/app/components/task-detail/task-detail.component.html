<div class="form-container" style="max-width: 600px; margin: 40px auto; padding: 0 20px;">
  <mat-card>
    <mat-card-header style="margin-bottom: 24px;">
      <mat-card-title>{{ isEditMode ? 'Edit Task' : 'Create New Task' }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="task-form" style="display: flex; flex-direction: column; gap: 16px;">
        
        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Task Title</mat-label>
          <input matInput type="text" formControlName="title" placeholder="E.g. Update user documentation">
          <mat-error *ngIf="taskForm.get('title')?.hasError('required')">Title is required.</mat-error>
          <mat-error *ngIf="taskForm.get('title')?.hasError('minlength')">Title must be at least 3 characters long.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let opt of statusOptions" [value]="opt">{{ opt }}</mat-option>
          </mat-select>
          <mat-error *ngIf="taskForm.get('status')?.hasError('required')">Status is required.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width: 100%;">
          <mat-label>Due Date</mat-label>
          <input matInput type="date" formControlName="due_date">
          <mat-error *ngIf="taskForm.get('due_date')?.hasError('required')">Due date is required.</mat-error>
        </mat-form-field>

        <mat-card-actions style="display: flex; justify-content: flex-end; gap: 12px; padding: 16px 0 0 0;">
          <button mat-button type="button" (click)="onCancel()">Cancel</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="!taskForm.valid">
            {{ isEditMode ? 'Save Changes' : 'Create Task' }}
          </button>
        </mat-card-actions>
      </form>
    </mat-card-content>
  </mat-card>
</div>
