<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Admin Login</h2>
      <p>Sign in to access the Admin Dashboard</p>
    </div>
    <form class="login-form" (submit)="onLogin($event)">
      <div *ngIf="errorMessage" class="error-alert" style="color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
        {{ errorMessage }}
      </div>
      <div class="form-group">
        <label for="email">Admin Email address</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="admin@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input 
            id="password" 
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••" 
            required
          >
          <button type="button" class="btn-view-password" (click)="togglePasswordVisibility()" aria-label="Toggle password visibility">
            @if (!showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            }
            @if (showPassword) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 2 20 20"/><path d="M10.41 10.41a3 3 0 1 1 4.18 4.18"/><path d="M17.47 17.47A10.64 10.64 0 0 1 12 19c-7 0-10-7-10-7a19.24 19.24 0 0 1 6.54-5.54"/><path d="M18.89 18.89a19.2 19.2 0 0 0 3.11-6.89s-3-7-10-7a10.64 10.64 0 0 0-4.53.97"/></svg>
            }
          </button>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-login admin-btn">Sign In as Admin</button>
      </div>
    </form>
   
  </div>
</div>
