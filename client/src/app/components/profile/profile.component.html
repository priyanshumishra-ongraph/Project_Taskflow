<div class="profile-container">
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar-large">{{ profile.firstName[0] }}{{ profile.lastName[0] }}</div>
      <h2>{{ profile.firstName }} {{ profile.lastName }}</h2>
      <p>{{ profile.email }}</p>
    </div>
    
    <div class="profile-body">
      <form class="profile-form" (ngSubmit)="saveProfile()">
        
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" [(ngModel)]="profile.firstName" name="firstName" class="form-control">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" [(ngModel)]="profile.lastName" name="lastName" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="profile.email" name="email" class="form-control" disabled>
          <small class="hint">Email address cannot be changed.</small>
        </div>

        <div class="form-divider"></div>

        <h3>Change Password</h3>
        
        <div class="form-group">
          <label>Current Password</label>
          <input type="password" [(ngModel)]="profile.currentPassword" name="currentPassword" class="form-control" placeholder="Enter current password">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" [(ngModel)]="profile.newPassword" name="newPassword" class="form-control" placeholder="New password">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" [(ngModel)]="profile.confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm new password">
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
